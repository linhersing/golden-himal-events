<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#4c302a"><title>Golden Himal Voice | Backoffice</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./simple.css"></head><body data-page="backoffice"><a class="skip" href="#main">Skip to content</a><header class="masthead wrap"><a class="brand" href="./"><img src="./images/brand-identity.png" width="60" height="60" alt=""><span><strong>GOLDEN HIMAL</strong></span></a></header><main id="main" class="page-shell">
<section class="panel" id="back-signin"><h2 data-t="backLogin">工作人員登入</h2><form id="back-email-form"><label class="field"><span data-t="staffEmail">受邀 Email</span><input type="email" name="email" required></label><button type="submit" class="btn btn-primary" data-t="sendCode">寄送驗證碼</button></form><form id="back-code-form" hidden><label class="field"><span data-t="enterCode">驗證碼</span><input type="text" name="code" required></label><button type="submit" class="btn btn-primary" data-t="verify">登入後台</button></form></section>
<section id="back-dashboard" hidden><div class="page-top"><h2 data-t="dashboard">後台總覽</h2><button type="button" class="btn btn-soft" id="back-logout" data-t="logout">登出</button></div>
<div id="organizer-dashboard" hidden><div class="dashboard-numbers"><div class="dash-stat"><div class="dashboard-number" id="paid-count">0</div><small data-t="dashPaid">已完成付款報名</small></div><div class="dash-stat"><div class="dashboard-number" id="unpaid-count">0</div><small data-t="dashUnpaid">待補繳/保留中</small></div><div class="dash-stat"><div class="dashboard-number" id="scored-count">0</div><small data-t="dashScored">已評分卡片數</small></div></div>
<div id="organizer-filters" class="filter-pill-bar" style="margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
<div class="filter-group" style="display:flex;gap:6px;align-items:center;"><span style="font-size:13px;font-weight:600;">歌曲語言：</span><button type="button" class="btn btn-soft btn-xs filter-pill active" data-filter-type="lang" data-filter-val="all">全部</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="lang" data-filter-val="華語">華語</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="lang" data-filter-val="台語">台語</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="lang" data-filter-val="英語">英語</button></div>
<div class="filter-group" style="display:flex;gap:6px;align-items:center;"><span style="font-size:13px;font-weight:600;">參賽組別：</span><button type="button" class="btn btn-soft btn-xs filter-pill active" data-filter-type="group" data-filter-val="all">全部</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="group" data-filter-val="青壯組">青壯組</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="group" data-filter-val="長青組">長青組</button></div>
<div class="filter-group" style="display:flex;gap:6px;align-items:center;"><span style="font-size:13px;font-weight:600;">評分狀態：</span><button type="button" class="btn btn-soft btn-xs filter-pill active" data-filter-type="scoreStatus" data-filter-val="all">全部</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="scoreStatus" data-filter-val="scored">已評分</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-filter-type="scoreStatus" data-filter-val="unscored">未評分</button></div>
</div>
<div id="admin-apps" class="cards"></div></div>
<div id="judge-dashboard" hidden><section class="panel"><h2 data-t="judgeTitle">我的評分工作台</h2><p data-t="judgeSub">查看作品後依項目給分，儲存後不能重複覆蓋。</p>
<div id="judge-filters" class="filter-pill-bar" style="margin-bottom:16px;display:flex;gap:8px;align-items:center;"><span style="font-size:13px;font-weight:600;">語言篩選：</span><button type="button" class="btn btn-soft btn-xs filter-pill active" data-judge-filter="all">全部</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-judge-filter="華語">華語</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-judge-filter="台語">台語</button><button type="button" class="btn btn-soft btn-xs filter-pill" data-judge-filter="英語">英語</button></div>
<div id="judge-roster-container"><div id="judge-roster-list" class="roster-list"></div><div id="judge-pagination" class="pagination-bar" style="margin-top:16px;display:flex;gap:8px;justify-content:center;align-items:center;"></div></div>
<div id="judge-modal-overlay" class="modal-overlay" style="display:none;" hidden><div class="modal-card panel" style="position:relative;"><button type="button" class="btn btn-soft btn-xs" id="close-judge-modal" style="position:absolute;top:12px;right:12px;">✕ 關閉</button><div id="judge-modal-body"></div></div></div>
<div id="judge-queue" class="cards"></div></section></div>
</section>
<footer class="site-footer"><a href="./" class="small-link" data-t="home">返回前台</a><small data-t="adminFooter">需受邀身份授權；不是公開評分頁。</small></footer>
</main><script src="./simple.js" defer></script></body></html>
