<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>工作人員後台｜Golden Himal Voice</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./simple.css"></head><body data-page="back"><header class="masthead wrap"><a class="brand" href="./"><img src="./images/brand-identity.png" width="60" height="60" alt=""><span><strong>GOLDEN HIMAL</strong><small>VOICE · CHITWAN 2027</small></span></a><a href="./" class="small-link" data-t="home">返回前台</a></header><main class="page-shell"><p class="section-eyebrow">STAFF ONLY</p><h1 class="page-heading" data-t="backTitle">賽事管理後台</h1><p class="page-intro" data-t="backLead">主辦單位查看報名人數與評分；評審從同一入口登入，各自只能操作自己的權限。</p><div class="role-tabs" hidden><button type="button" class="active" data-role-tab="organizer" data-t="organizer">主辦方</button><button type="button" data-role-tab="reviewer" data-t="judge">評審</button></div><div id="back-status" class="feedback" role="status" aria-live="polite" hidden></div><p class="notice" data-t="backBoundary">權限由伺服器確認，僅受邀測試帳號可登入。沒有任何真實付款，因此正式成功報名人數不能用模擬付款推算。</p>
<section class="panel" id="back-signin"><h2 data-t="backLogin">工作人員登入</h2><form id="back-email-form"><label class="field"><span data-t="staffEmail">受邀 Email</span><input name="email" type="email" autocomplete="email" required></label><div id="signup-turnstile" hidden aria-label="管理員與評審真人驗證"></div><p id="signup-human-status" class="human-check-status" role="status" aria-live="polite" hidden></p><div class="form-actions"><button class="btn btn-primary" type="submit" data-t="sendCode">寄送驗證碼</button></div></form><button id="signup-human-retry" type="button" class="btn btn-soft human-check-retry" hidden>重新載入真人驗證</button><form id="back-code-form" hidden><label class="field"><span data-t="verifyCode">輸入 6 位驗證碼</span><input name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></label><div class="form-actions"><button class="btn btn-primary" type="submit" data-t="backEnter">進入後台</button><button type="button" class="btn btn-soft" id="back-change" data-t="changeEmail">更換 Email</button></div></form></section>
<section id="back-dashboard" hidden><div class="page-top"><h2 data-t="dashboard">後台總覽</h2><button type="button" class="btn btn-soft" id="back-logout" data-t="logout">登出</button></div><div id="organizer-dashboard" hidden><div class="dashboard-numbers"><div class="dash-stat"><div class="dashboard-number" id="paid-count">0</div><small data-t="paidCount">正式付款完成</small></div><div class="dash-stat"><div class="dashboard-number" id="pending-count">—</div><small data-t="pendingCount">測試資料筆數</small></div><div class="dash-stat"><div class="dashboard-number" id="scores-count">—</div><small data-t="scoresCount">評審回覆筆數</small></div></div><p class="notice" data-t="notPaid">目前未接正式金流，正式完成報名數為 0；測試付款或待付款資料不算成功報名。</p><div class="panel"><h2 data-t="registrationList">報名紀錄（目前僅測試資料）</h2><div class="roster-toolbar" aria-label="報名名冊搜尋與篩選">
<label class="roster-field"><span>搜尋選手、曲目、編號</span><input id="organizer-search" type="search" placeholder="搜尋姓名、歌曲、報名編號"></label>
<label class="roster-field"><span>歌曲語言</span><select id="organizer-language"><option value="">所有語言</option><option value="Nepali">尼泊爾語</option><option value="English">英文</option><option value="Hindi">印地語</option><option value="Maithili">邁蒂利語</option><option value="Bhojpuri">博傑普爾語</option><option value="Tamang">塔芒語</option><option value="Chinese">中文</option><option value="Other">其他</option></select></label>
<label class="roster-field"><span>參賽組別</span><select id="organizer-category"><option value="">所有組別</option><option value="university">大學組</option><option value="community">社會組</option></select></label>
<label class="roster-field"><span>測試狀態</span><select id="organizer-status"><option value="">所有狀態</option><option value="scored">已有評分</option><option value="unscored">尚未評分</option><option value="simulated_paid">已模擬付款</option><option value="unpaid">未付款</option></select></label>
</div><p class="roster-count" id="organizer-count" role="status" aria-live="polite"></p>
<div id="admin-apps" class="roster-list"></div><nav id="organizer-pagination" class="roster-pagination" aria-label="報名名單分頁"></nav></div></div><div id="judge-dashboard" hidden><section class="panel"><h2 data-t="judgeTitle">我的評分工作台</h2><p data-t="judgeSub">查看作品後依項目給分，儲存後不能重複覆蓋。</p><div id="judge-roster-panel">
<div class="roster-toolbar">
<label class="roster-field"><span>尋找參賽者</span><input id="judge-search" type="search" placeholder="姓名、歌曲或報名編號"></label>
<label class="roster-field"><span>我的評分狀態</span><select id="judge-status"><option value="">全部</option><option value="unscored">尚未評分</option><option value="scored">已評分</option></select></label>
</div><p class="roster-count" id="judge-count" role="status" aria-live="polite"></p><div id="judge-list" class="roster-list"></div><nav id="judge-pagination" class="roster-pagination" aria-label="評審名單分頁"></nav>
</div>
<section id="judge-detail" class="roster-detail" aria-label="參賽者作品與評分" hidden>
<button id="judge-back-list" type="button" class="btn btn-soft">← 返回參賽者名單</button>
<div id="judge-queue" class="cards"></div>
</section></section></div></section>
<footer class="site-footer"><a href="./" class="small-link" data-t="home">返回前台</a><small data-t="adminFooter">需受邀身分授權；不是公開評分頁。</small></footer></main><script src="./simple.js" defer></script></body></html>
