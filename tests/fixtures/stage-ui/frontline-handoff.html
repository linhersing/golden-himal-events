<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontline handoff · isolated TEST</title><link rel="stylesheet" href="stage-test.css"><link rel="stylesheet" href="frontline-handoff.css"><script src="frontline-handoff.js" defer></script></head><body data-mode="handoff"><main>
<header><a href="staff-login.html" data-word="back"></a><label>語言 / Language / भाषा<select id="handoff-language"><option value="zh">繁體中文</option><option value="en">English</option><option value="ne">नेपाली</option></select></label></header>
<h1 id="handoff-title" data-word="title"></h1><p class="notice" data-word="boundary"></p><p data-word="workflow"></p><p id="handoff-status" role="status" aria-live="polite"></p>

<section id="handoff-receipt" hidden><h2 data-word="receipt"></h2><p id="handoff-receipt-text"></p><nav><a href="stage-test.html?stage=final" data-word="judge"></a><a href="vote-admin-test.html" data-word="vote"></a></nav></section>
</main></body></html>
