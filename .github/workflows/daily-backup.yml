# Independent Git integrity check only. Daily 18:00 Drive backups are handled
# by the existing ChatGPT automation; do not schedule a duplicate uploader.
name: Golden Himal Git Backup Integrity Check (manual)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily-backup.yml'

permissions:
  contents: read

jobs:
  verify-git-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create and verify complete Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-check
          git bundle create backup-check/golden-himal-events.bundle --all
          git bundle verify backup-check/golden-himal-events.bundle
          test -s backup-check/golden-himal-events.bundle
          sha256sum backup-check/golden-himal-events.bundle > backup-check/golden-himal-events.bundle.sha256
          sha256sum -c backup-check/golden-himal-events.bundle.sha256
          {
            echo '### Golden Himal Git recovery integrity check'
            echo 'Git bundle: **created and verified** (temporary runner only).'
            echo 'SHA-256 checksum: **verified**.'
            echo 'Google Drive backup: **not uploaded by this workflow**.'
            echo 'Cloudflare D1, R2, deployed Worker and Resend: **not exported**.'
            echo 'Daily 18:00 Drive backup remains owned by the existing ChatGPT automation.'
          } >> "$GITHUB_STEP_SUMMARY"
